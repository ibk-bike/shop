<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IBK Motorcycle ERP</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0d14"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--b1:#eef0f7;--g:rgba(255,255,255,.5);--gb:rgba(255,255,255,.75);--tx:#14161c;--mu:#5d6272;--ac:#e10600;--in:rgba(255,255,255,.65);--sh:0 10px 40px rgba(40,50,100,.18);--ok:#0a8f4d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--b1:#0b0d14;--g:rgba(255,255,255,.08);--gb:rgba(255,255,255,.2);--tx:#f2f3f8;--mu:#a3a8ba;--in:rgba(255,255,255,.1);--sh:0 10px 40px rgba(0,0,0,.5);--ok:#37d489}}
:root[data-theme=dark]{--b1:#0b0d14;--g:rgba(255,255,255,.08);--gb:rgba(255,255,255,.2);--tx:#f2f3f8;--mu:#a3a8ba;--in:rgba(255,255,255,.1);--sh:0 10px 40px rgba(0,0,0,.5);--ok:#37d489}
*{box-sizing:border-box}html,body{margin:0}
body{font:14px/1.45 "Cinzel",Georgia,"Times New Roman",serif;color:var(--tx);background:var(--b1);min-height:100vh}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(40vw 40vw at 12% 8%,rgba(225,6,0,.5),transparent 62%),radial-gradient(45vw 45vw at 92% 18%,rgba(60,90,255,.38),transparent 62%),radial-gradient(50vw 50vw at 60% 105%,rgba(180,60,255,.32),transparent 62%),var(--b1)}
.glass{background:var(--g);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gb);box-shadow:var(--sh),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -1px 0 rgba(255,255,255,.08);border-radius:24px}
#app{display:flex;gap:16px;padding:16px}
#nav{width:216px;flex:none;position:sticky;top:16px;height:calc(100vh - 32px);padding:14px;display:flex;flex-direction:column;gap:6px}
.logo{background:#000;border-radius:16px;overflow:hidden;margin-bottom:10px}.logo img{width:100%;display:block}.ow{color:#fff;text-align:center;font-size:11px;font-weight:700;padding:0 4px 8px;letter-spacing:1px}
#nav a{display:flex;gap:10px;align-items:center;padding:11px 13px;border-radius:14px;cursor:pointer;color:var(--mu);font-weight:600}
#nav a.on{background:var(--in);color:var(--tx);box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 0 0 1px var(--gb)}
#nav a.on span{filter:drop-shadow(0 0 6px var(--ac))}
#main{flex:1;min-width:0}
h1{font-size:22px;margin:4px 0 14px;letter-spacing:-.3px}h3{margin:0 0 10px;font-size:15px}
.pad{padding:18px;margin-bottom:16px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:120px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.stat{padding:16px}.stat small{color:var(--mu)}.stat b{display:block;font-size:22px;margin-top:4px}
.two{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;align-items:start}
input,select,textarea{width:100%;padding:11px 13px;border-radius:14px;border:1px solid var(--gb);background:var(--in);color:var(--tx);font:inherit;outline:none}
input:focus{box-shadow:0 0 0 2px var(--ac)}
label{display:block;font-size:12px;color:var(--mu);margin:8px 0 4px}
.btn{border:1px solid var(--gb);background:var(--in);color:var(--tx);padding:10px 16px;border-radius:14px;font:inherit;font-weight:600;cursor:pointer;display:inline-block;text-decoration:none;flex:none}
.btn.p{background:linear-gradient(180deg,#ff3b30,#d10a00);color:#fff;border-color:rgba(255,255,255,.4);box-shadow:0 6px 18px rgba(225,6,0,.4),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.s{padding:6px 11px;font-size:12px;border-radius:10px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mu);font-weight:600;font-size:12px}
th,td{padding:9px 8px;border-bottom:1px solid var(--gb);white-space:nowrap}td input{padding:6px 8px;min-width:60px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px;max-height:420px;overflow:auto}
.it{padding:12px;border-radius:16px;background:var(--in);border:1px solid var(--gb);cursor:pointer}.it:hover{box-shadow:0 0 0 2px var(--ac)}.it small{color:var(--mu)}
.low{color:var(--ac);font-weight:700}.ok{color:var(--ok);font-weight:700}.mu{color:var(--mu)}.r{text-align:right}
.tot div{display:flex;justify-content:space-between;padding:4px 0}.tot .big{font-size:20px;font-weight:800;border-top:1px solid var(--gb);margin-top:6px;padding-top:10px}
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(0,0,0,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);overflow:auto}
.mbox{width:100%;max-width:460px;padding:20px;max-height:94vh;overflow:auto;background:var(--g)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);z-index:60;padding:11px 18px;border-radius:16px;display:none;font-weight:600}
#inv{background:#fff;color:#111;border-radius:14px;padding:18px;font-size:13px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#inv .ih{display:flex;gap:12px;align-items:center;border-bottom:3px solid #e10600;padding-bottom:10px;margin-bottom:8px}#inv .ih img{width:120px}
#inv .im{display:flex;justify-content:space-between;margin:6px 0}#inv th,#inv td{border-bottom:1px solid #ddd;color:#111;padding:6px 4px;white-space:normal}
#inv .tt div{display:flex;justify-content:space-between;padding:2px 0}#inv .ft{text-align:center;margin-top:12px;color:#555;border-top:1px dashed #bbb;padding-top:8px}
@media(max-width:820px){#app{padding:10px 10px 96px;display:block}
#nav{position:fixed;z-index:40;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));top:auto;width:auto;height:auto;flex-direction:row;padding:6px;border-radius:22px;gap:2px}
.logo{display:none}#nav a{flex:1;flex-direction:column;gap:0;padding:6px 2px;font-size:8px;text-align:center}#nav a span{font-size:18px}
.two{grid-template-columns:1fr}}
@media print{body>*:not(#modal){display:none!important}body::before{display:none}#modal{position:static!important;display:block!important;background:none!important;backdrop-filter:none!important;padding:0!important}.mbox{background:none!important;box-shadow:none!important;border:0!important;max-width:none!important;padding:0!important;backdrop-filter:none!important}.np{display:none!important}}
.foot{text-align:center;color:var(--mu);font-size:12px;margin:18px 0 8px}.foot a{color:var(--ac);font-weight:700;text-decoration:none}
</style></head><body>

<div class="glass pad"><h3>Recent Bills</h3>${db.sa.length?'<div class="tw"><table>'+db.sa.slice(-5).reverse().map(s=>`<tr><td>#${s.no}</td><td>${D(s.t)}</td><td>${E(s.name||'Walk-in')}</td><td class="r">${R(s.total)}</td><td><button class="btn s" onclick="view(${s.id})">View</button></td></tr>`).join('')+'</table></div>':'<span class="mu">No bills yet. Start with “New Bill”.</span>'}</div>`},
bill(){return`<h1>New Bill</h1><div id="lt" class="glass" style="position:sticky;top:8px;z-index:5;padding:12px 18px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center"></div><div class="two"><div class="glass pad"><input id="q" placeholder="Search items..." oninput="updGrid()"><div id="grid" class="grid"></div></div>
<div class="glass pad"><div class="row"><input id="cn" list="cl" placeholder="Customer name" oninput="custFill()"><input id="cp" placeholder="Phone number" inputmode="tel"></div>
<datalist id="cl">${db.cu.map(c=>`<option value="${E(c.name)}">`).join('')}</datalist><div id="cart"></div></div></div>`},
stock(){return`<div class="row"><h1 style="flex:1">Stock</h1><button class="btn p" style="flex:none" onclick="pform()">+ New Item</button></div><div class="glass pad tw">${db.p.length?`<table><tr><th>Item</th><th>Cost</th><th>Sale price</th><th>Stock</th><th></th></tr>${db.p.map(p=>`<tr><td>${E(p.n)}</td><td>${R(p.c)}</td><td>${R(p.s)}</td><td class="${p.q<=5?'low':''}">${p.q}</td><td><button class="btn s" onclick="restock(${p.id})">Restock</button> <button class="btn s" onclick="pform(${p.id})">Edit</button> <button class="btn s" onclick="delp(${p.id})">Delete</button></td></tr>`).join('')}</table>`:'<span class="mu">No items yet. Tap “New Item”.</span>'}</div>`},
cust(){return`<h1>Customers</h1><div class="glass pad tw">${db.cu.length?`<table><tr><th>Name</th><th>Phone</th><th>Credit</th><th></th></tr>${db.cu.map(c=>`<tr><td>${E(c.name)}</td><td>${E(c.ph)}</td><td class="${c.bal>0?'low':'ok'}">${R(c.bal)}</td><td><button class="btn s" onclick="custHist(${c.id})">History</button> ${c.bal>0?`<button class="btn s" onclick="recvForm(${c.id})">Receive Payment</button>`:''}</td></tr>`).join('')}</table>`:'<span class="mu">Customers are saved automatically when you create a bill.</span>'}</div>`},
hist(){return`<h1>Bills</h1><div class="glass pad"><div class="row"><input placeholder="Search bill no, customer or phone" value="${E(hq)}" oninput="hq=this.value;updHist()"><div><label>From</label><input type="date" value="${hf}" onchange="hf=this.value;updHist()"></div><div><label>To</label><input type="date" value="${ht}" onchange="ht=this.value;updHist()"></div></div></div><div class="glass pad tw" id="hl"></div>`},
rec(){return`<div class="row"><h1 style="flex:1">Records</h1><button class="btn p" style="flex:none" onclick="expForm()">+ Add Expense</button><button class="btn" style="flex:none" onclick="resetExpForm()">Reset Expenses</button></div><div class="glass pad"><div class="row"><select onchange="rt=this.value;updRec()">${['All','Sale','Payment','Stock','Item','Expense'].map(x=>`<option${x==rt?' selected':''}>${x}</option>`).join('')}</select><input placeholder="Search records..." value="${E(rq)}" oninput="rq=this.value;updRec()"></div></div><div class="glass pad tw" id="rl"></div>`},
set(){const s=db.st,f=(k,l)=>`<label>${l}</label><input value="${E(s[k])}" onchange="db.st.${k}=this.value;save();toast('Saved')">`;
return`<h1>Settings</h1><div class="glass pad"><h3>Shop details (printed on bills)</h3>${f('name','Shop name')}${f('owner','Owner name')}${f('phone','Phone number')}${f('addr','Address')}${f('note','Bill footer note')}</div><div class="glass pad"><h3>Theme and backup</h3><div class="row"><button class="btn" onclick="theme()">Switch Light / Dark</button><button class="btn" onclick="backup()">Backup / Restore</button></div><p class="mu">Data syncs automatically while you are signed in and online. Copy a backup now and then and keep it somewhere safe.</p></div><div class="glass pad"><h3>Reset data</h3><p class="mu">Each item resets separately and asks for confirmation first.</p><div class="row"><button class="btn" onclick="resetForm('ex')">Reset Expenses</button><button class="btn" onclick="resetForm('sa')">Reset Bills</button><button class="btn" onclick="resetForm('p')">Reset Items &amp; Stock</button><button class="btn" onclick="resetForm('cu')">Reset Customers</button><button class="btn" onclick="resetForm('lg')">Reset Records</button></div></div><div class="glass pad"><h3>Cloud sync</h3><p class="mu">Check that your data is saved in the cloud.</p><button class="btn" onclick="syncTest()">Check Sync</button>${ME?`<p class="mu">Signed in as ${E(ME)}</p><button class="btn" onclick="signOut()">Sign out</button>`:''}</div>`}};
function updHist(){const q=hq.toLowerCase(),a=hf?new Date(hf+'T00:00:00').getTime():0,b=ht?new Date(ht+'T23:59:59').getTime():1e15,l=db.sa.filter(s=>s.t>=a&&s.t<=b&&(!q||`${s.no} ${s.name||'walk-in'} ${s.ph||''}`.toLowerCase().includes(q))).reverse();
$('#hl').innerHTML=l.length?`<table><tr><th>#</th><th>Date</th><th>Customer</th><th>Total</th><th>Paid</th><th>Balance</th><th></th></tr>${l.map(s=>`<tr><td>${s.no}</td><td>${D(s.t)} ${T(s.t)}</td><td>${E(s.name||'Walk-in')}</td><td>${R(s.total)}</td><td>${R(s.paid)}</td><td class="${s.total>s.paid?'low':''}">${R(s.total-s.paid)}</td><td><button class="btn s" onclick="view(${s.id})">View</button> <button class="btn s" onclick="dels(${s.id})">Delete</button></td></tr>`).join('')}</table><p><b>${l.length} bills | Sales ${R(sumf(l,s=>s.total))} | Received ${R(sumf(l,s=>s.paid))} | Credit ${R(sumf(l,s=>s.total-s.paid))} | Profit ${R(sumf(l,profit))}</b></p>`:'<span class="mu">No bills match.</span>'}
function updRec(){const q=rq.toLowerCase(),l=(db.lg||[]).filter(e=>(rt=='All'||e.k==rt)&&(!q||e.d.toLowerCase().includes(q))).slice().reverse().slice(0,300);
$('#rl').innerHTML=l.length?`<table><tr><th>Date</th><th>Type</th><th>Details</th><th class="r">Amount</th></tr>${l.map(e=>`<tr><td>${D(e.t)} ${T(e.t)}</td><td>${e.k}</td><td style="white-space:normal">${E(e.d)}</td><td class="r">${e.a?R(e.a):''}</td></tr>`).join('')}</table>`:'<span class="mu">No records yet. Every sale, payment, stock change and expense appears here.</span>'}
function custHist(id){hq=db.cu.find(x=>x.id==id).name;hf='';ht='';go('hist')}
function delpOk(id){const p=db.p.find(x=>x.id==id);db.p=db.p.filter(x=>x.id!=id);lg('Item','Deleted item '+p.n);save();closeM();render()}
function restock(id){const p=db.p.find(x=>x.id==id);mod(`<h3>Restock ${E(p.n)}</h3><p class="mu">Current stock: ${p.q}</p><label>Quantity to add</label><input id="rs" type="number" min="1"><div class="row" style="margin-top:12px"><button class="btn p" onclick="restockOk(${id})">Add Stock</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}
function restockOk(id){const p=db.p.find(x=>x.id==id),n=+$('#rs').value||0;if(n<=0)return toast('Enter a valid quantity');p.q+=n;lg('Stock',`${p.n}: +${n} restocked`);save();closeM();render();toast('Stock updated')}
function expForm(){mod(`<h3>Add Expense</h3><label>Description</label><input id="xd" placeholder="e.g. Shop rent, packaging"><label>Amount (Rs)</label><input id="xa" type="number"><div class="row" style="margin-top:12px"><button class="btn p" onclick="saveExp()">Save Expense</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}
function resetExpForm(){const t=sumf(db.ex||[],e=>e.a);mod(`<h3>Reset all expenses?</h3><p class="mu">This removes ${(db.ex||[]).length} expense entries (total ${R(t)}) and sets expenses back to Rs 0. Bills, stock and customers are not affected. This cannot be undone.</p><div class="row"><button class="btn p" onclick="resetExp()">Yes, reset</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}
function resetExp(){const t=sumf(db.ex||[],e=>e.a);db.ex=[];lg('Expense',`Expenses reset (cleared ${R(t)})`);save();closeM();render();toast('Expenses reset')}
const RS={ex:['Expenses',()=>(db.ex||[]).length+' expense entries (total '+R(sumf(db.ex||[],e=>e.a))+')',()=>{db.ex=[]},'Expense'],sa:['Bills',()=>db.sa.length+' bills (sales '+R(sumf(db.sa,s=>s.total))+')',()=>{db.sa=[]},'Sale'],p:['Items & Stock',()=>db.p.length+' items',()=>{db.p=[]},'Item'],cu:['Customers',()=>db.cu.length+' customers (credit '+R(sumf(db.cu,c=>Math.max(c.bal,0)))+')',()=>{db.cu=[]},'Payment'],lg:['Records',()=>(db.lg||[]).length+' record entries',()=>{db.lg=[]},'']};
function resetForm(k){mod(`<h3>Reset ${RS[k][0].replace('&','&amp;')}?</h3><p class="mu">This permanently removes ${RS[k][1]()}. Nothing else is changed. This cannot be undone.</p><div class="row"><button class="btn p" onclick="resetDo('${k}')">Yes, reset</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}
function resetDo(k){const d=RS[k][1]();RS[k][2]();if(k!='lg')lg(RS[k][3],RS[k][0]+' reset (cleared '+d+')');save();closeM();render();toast(RS[k][0]+' reset')}
async function syncTest(){const ok=(t,b)=>mod(`<h3>${t}</h3><p class="mu">${b}</p><button class="btn" onclick="closeM()">Close</button>`);
if(!cdb)return ok('Sync is not active','Firebase is not set up or you are not signed in. Right now data is saved only on this device.');
try{const r=cdb.doc('meta/test'),v=Date.now();await r.set({v});const g=await r.get();await r.delete();if(!(g.exists&&g.data().v==v))throw 0;
const lp=parts(),pend=Object.keys(lp).filter(k=>last[k]!==cj(lp[k])).length;
ok('Cloud sync works',`Test write and read succeeded.<br>Saved in cloud: ${Object.keys(rem.p).length} items, ${Object.keys(rem.cu).length} customers, ${Object.keys(rem.sa).length} bills.<br>Waiting to upload: ${pend}.`)}catch(e){ok('Sync problem','Could not reach the cloud right now. Your data is safe on this device. Try again when online.')}}
function saveExp(){const d=$('#xd').value.trim(),a=+$('#xa').value||0;if(!d||a<=0)return toast('Enter description and amount');(db.ex=db.ex||[]).push({id:nid(),t:Date.now(),a,d});lg('Expense',d,a);save();closeM();render();toast('Expense saved')}
function updGrid(){const q=($('#q')||{value:''}).value.toLowerCase(),g=$('#grid');if(!g)return;const l=db.p.filter(p=>p.n.toLowerCase().includes(q));g.innerHTML=l.length?l.map(p=>`<div class="it" onclick="add(${p.id})"><b>${E(p.n)}</b><br>${R(p.s)}<br><small class="${p.q<=5?'low':''}">Stock: ${p.q}</small></div>`).join(''):'<span class="mu">Koi item nahi mila.</span>'}
function add(id){const p=db.p.find(x=>x.id==id),l=cart.find(x=>x.id==id);if(l)l.q++;else cart.push({id,n:p.n,q:1,p:p.s,c:p.c});updCart()}
function custFill(){const c=db.cu.find(x=>x.name.toLowerCase()==$('#cn').value.trim().toLowerCase());if(c){$('#cp').value=c.ph;calc()}}
function updCart(){const el=$('#cart');if(!el)return;const dv=($('#dd')||{}).value||'',pv=($('#pd')||{}).value||'';
el.innerHTML=(cart.length?`<div class="tw"><table><tr><th>Item</th><th>Qty</th><th>Rate</th><th class="r">Amount</th><th></th></tr>${cart.map((l,i)=>`<tr><td>${E(l.n)}</td><td><input type="number" min="1" value="${l.q}" style="width:70px" onchange="cart[${i}].q=Math.max(1,+this.value||1);updCart()"></td><td><input type="number" value="${l.p}" style="width:90px" onchange="cart[${i}].p=+this.value||0;updCart()"></td><td class="r">${R(l.q*l.p)}</td><td><button class="btn s" onclick="cart.splice(${i},1);updCart()">✕</button></td></tr>`).join('')}</table></div>`:'<p class="mu">Click an item to add it to the bill.</p>')+`<div class="row"><div><label>Discount (Rs)</label><input id="dd" type="number" value="${dv}" oninput="calc()"></div><div><label>Amount received (blank = full)</label><input id="pd" type="number" value="${pv}" oninput="calc()"></div></div><div class="tot" id="tot"></div><button class="btn p" style="width:100%;margin-top:10px" onclick="saveBill()">Save & Print Bill</button>`;calc()}
function figs(){const sub=sumf(cart,l=>l.q*l.p),disc=Math.min(+($('#dd')||{}).value||0,sub),total=sub-disc,pv=($('#pd')||{}).value,paid=pv===''||pv==null?total:Math.min(+pv,total);return{sub,disc,total,paid,rem:total-paid}}
function calc(){const t=$('#tot');if(!t)return;const f=figs(),lt=$('#lt');if(lt)lt.innerHTML=`<span>${cart.reduce((a,l)=>a+l.q,0)} items</span><b style="font-size:22px;color:var(--ac)">Total ${R(f.total)}</b>`;const c=db.cu.find(x=>x.name.toLowerCase()==($('#cn').value||'').trim().toLowerCase()),pb=c?c.bal:0;t.innerHTML=`<div><span>Subtotal</span><span>${R(f.sub)}</span></div><div><span>Discount</span><span>- ${R(f.disc)}</span></div><div class="big"><span>Total</span><span>${R(f.total)}</span></div><div><span>Received</span><span>${R(f.paid)}</span></div><div><span>Balance on this bill</span><span class="${f.rem>0?'low':''}">${R(f.rem)}</span></div>${pb?`<div><span>Previous credit</span><span>${R(pb)}</span></div>`:''}`}
function saveBill(){if(!cart.length)return toast('Add an item first');
for(const l of cart){const p=db.p.find(x=>x.id==l.id);if(!p||p.q<l.q)return toast('Not enough stock: '+l.n)}
const f=figs();let name=$('#cn').value.trim(),ph=$('#cp').value.trim();if(f.rem>0&&!name)return toast('Enter customer name for credit sales');
let c=null;if(name||ph){c=db.cu.find(x=>(ph&&dg(x.ph)==dg(ph))||(name&&x.name.toLowerCase()==name.toLowerCase()));if(!c){c={id:nid(),name:name||ph,ph,bal:0};db.cu.push(c)}else if(ph&&!c.ph)c.ph=ph;name=c.name;ph=c.ph}
cart.forEach(l=>db.p.find(x=>x.id==l.id).q-=l.q);if(c)c.bal+=f.rem;
const s={id:nid(),no:nextNo(),t:Date.now(),cu:c?c.id:null,name,ph,items:cart.map(l=>({...l})),sub:f.sub,disc:f.disc,total:f.total,paid:f.paid,bal:c?c.bal:0};db.sa.push(s);lg('Sale',`Bill #${s.no} to ${s.name||'Walk-in'}: ${s.items.map(i=>i.n+' x'+i.q).join(', ')} (received ${R(s.paid)})`,s.total);s.items.forEach(i=>lg('Stock',`${i.n}: -${i.q} sold on bill #${s.no}`));save();cart=[];render();view(s.id)}
function inv(s){return`<div id="inv"><div class="ih"><img src="${LOGO}" alt=""><div><b style="font-size:16px">${E(db.st.name)}</b><div>Owner: ${E(db.st.owner)}</div><div>Phone: ${E(db.st.phone)}</div><div>${E(db.st.addr)}</div></div></div><div class="im"><span>Bill # <b>${s.no}</b></span><span>${D(s.t)} ${T(s.t)}</span></div><div>Customer: <b>${E(s.name||'Walk-in')}</b>${s.ph?' | '+E(s.ph):''}</div>
<table style="margin:8px 0"><tr><th>Item</th><th>Qty</th><th>Rate</th><th style="text-align:right">Amount</th></tr>${s.items.map(i=>`<tr><td>${E(i.n)}</td><td>${i.q}</td><td>${R(i.p)}</td><td style="text-align:right">${R(i.q*i.p)}</td></tr>`).join('')}</table>
<div class="tt"><div><span>Subtotal</span><span>${R(s.sub)}</span></div>${s.disc?`<div><span>Discount</span><span>- ${R(s.disc)}</span></div>`:''}<div><b>Total</b><b>${R(s.total)}</b></div><div><span>Received</span><span>${R(s.paid)}</span></div><div><span>Balance</span><span>${R(s.total-s.paid)}</span></div>${s.cu?`<div><span>Customer total credit</span><span>${R(s.bal)}</span></div>`:''}</div><div class="ft">${E(db.st.note)}<br>${E(db.st.phone)}</div></div>`}
function view(id){const s=db.sa.find(x=>x.id==id),ph=dg(s.ph).replace(/^0/,'92'),msg=encodeURIComponent(`${db.st.name} - Bill #${s.no}\nTotal: ${R(s.total)}\nReceived: ${R(s.paid)}\nBalance: ${R(s.total-s.paid)}\n${db.st.phone}`);
mod(inv(s)+`<div class="row np" style="margin-top:12px"><button class="btn p" onclick="window.print()">Print</button>${ph?`<a class="btn" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${msg}">WhatsApp</a>`:''}<button class="btn" onclick="closeM()">Close</button></div>`)}
function pform(id){const p=db.p.find(x=>x.id==id)||{n:'',c:'',s:'',q:''};mod(`<h3>${id?'Edit Item':'New Item'}</h3><label>Item name</label><input id="fn" value="${E(p.n)}"><div class="row"><div><label>Purchase cost</label><input id="fc" type="number" value="${p.c}"></div><div><label>Sale price</label><input id="fs" type="number" value="${p.s}"></div></div><label>Stock quantity</label><input id="fq" type="number" value="${p.q}"><div class="row" style="margin-top:14px"><button class="btn p" onclick="savep(${id||0})">Save</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}
function savep(id){const n=$('#fn').value.trim();if(!n)return toast('Enter an item name');const v={n,c:+$('#fc').value||0,s:+$('#fs').value||0,q:+$('#fq').value||0};if(id){const o=db.p.find(x=>x.id==id),dq=v.q-o.q;Object.assign(o,v);lg('Item',`Edited ${v.n}: cost ${R(v.c)}, price ${R(v.s)}`);if(dq)lg('Stock',`${v.n}: ${dq>0?'+':''}${dq} manual adjustment`)}else{db.p.push({id:nid(),...v});lg('Item',`Added new item ${v.n} (cost ${R(v.c)}, price ${R(v.s)}, qty ${v.q})`)}save();closeM();render()}
function delp(id){mod(`<h3>Delete this item?</h3><div class="row"><button class="btn p" onclick="delpOk(${id})">Yes, delete</button><button class="btn" onclick="closeM()">No</button></div>`)}
function dels(id){mod(`<h3>Delete this bill?</h3><p class="mu">Stock will be restored and the customer’s credit corrected.</p><div class="row"><button class="btn p" onclick="delsOk(${id})">Yes, delete</button><button class="btn" onclick="closeM()">No</button></div>`)}
function delsOk(id){const s=db.sa.find(x=>x.id==id);s.items.forEach(i=>{const p=db.p.find(x=>x.id==i.id);if(p)p.q+=i.q});const c=db.cu.find(x=>x.id==s.cu);if(c)c.bal-=s.total-s.paid;db.sa=db.sa.filter(x=>x.id!=id);lg('Sale',`Deleted bill #${s.no} (stock and credit restored)`,-s.total);save();closeM();render()}
function recvForm(id){const c=db.cu.find(x=>x.id==id);mod(`<h3>Payment from ${E(c.name)}</h3><p class="mu">Outstanding: ${R(c.bal)}</p><input id="ra" type="number" value="${c.bal}"><div class="row" style="margin-top:12px"><button class="btn p" onclick="recv(${id})">Save</button><button class="btn" onclick="closeM()">Cancel</button></div>`)}
function recv(id){const c=db.cu.find(x=>x.id==id),a=Math.min(+$('#ra').value||0,c.bal);if(a<=0)return toast('Enter a valid amount');c.bal-=a;lg('Payment',`Received from ${c.name}`,a);save();closeM();render();toast(R(a)+' received')}
function theme(){const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--b1').trim()=='#0b0d14',n=d?'light':'dark';r.dataset.theme=n;try{localStorage.setItem('ibk_th',n)}catch(e){}}
function backup(){mod(`<h3>Backup / Restore</h3><p class="mu">Copy the text below and keep it safe. To restore, paste a previous backup here and tap Restore.</p><textarea id="bk" rows="8">${E(JSON.stringify(db))}</textarea><div class="row" style="margin-top:12px"><button class="btn p" onclick="try{db=JSON.parse($('#bk').value);save();closeM();render();toast('Restored')}catch(e){toast('Invalid backup text')}">Restore</button><button class="btn" onclick="closeM()">Close</button></div>`)}
const nid=()=>Date.now()*10+Math.floor(Math.random()*10),dk=t=>new Date(t).toISOString().slice(0,10),cl=o=>JSON.parse(JSON.stringify(o));
const cj=o=>JSON.stringify(o,(k,v)=>v&&typeof v=='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
let cdb=null,last={},rem={p:{},cu:{},sa:{},lg:{},ex:{},meta:null},busy=0,dirty=0,bad=0,syT='';
const byT=(a,b)=>a.t-b.t||a.id-b.id,byI=(a,b)=>a.id-b.id;
function nextNo(){const n=Math.max(db.no||1,1+Math.max(0,...db.sa.map(s=>s.no)));db.no=n+1;return n}
function foot(){return`<div class="foot">Developed by <a href="https://hassan-banxash.web.app" target="_blank" rel="noopener">Hassan Banxash</a><br><span id="sy">${syT}</span></div>`}
function setSy(t){syT=t;const e=$('#sy');if(e)e.textContent=t}
function parts(){const o={'meta/main':{st:db.st,v:1}};db.p.forEach(x=>o['p/'+x.id]=x);db.cu.forEach(x=>o['cu/'+x.id]=x);db.sa.forEach(x=>o['sa/'+x.id]=x);
[['lg',db.lg||[]],['ex',db.ex||[]]].forEach(([k,a])=>{const g={};a.forEach(e=>{e.id=e.id||nid();(g[dk(e.t)]=g[dk(e.t)]||[]).push(e)});for(const d in g)o[k+'/'+d]={list:g[d].sort(byT)}});return o}
async function push(){if(!cdb)return;busy++;
try{const cur=parts(),ops=[];for(const k in cur){const s=cj(cur[k]);if(last[k]!==s)ops.push([k,s])}
for(const k in last)if(!(k in cur)&&/^(p|cu|sa|ex|lg)\//.test(k))ops.push([k,null]);
for(const [k,s] of ops){const ref=cdb.doc(k);if(s===null){await ref.delete();delete last[k];continue}
